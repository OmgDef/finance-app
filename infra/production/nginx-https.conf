server {
    listen 443 ssl;
    server_name teta.zslon.ru;

    ssl_certificate /etc/letsencrypt-teta/live/teta.zslon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-teta/live/teta.zslon.ru/privkey.pem;
    root /opt/tetafinance/current/site;
    client_max_body_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";

    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/api/v1/admin/ {
        proxy_pass http://127.0.0.1:18443;
    }

    location ^~ /admin/api/ {
        return 404;
    }

    location ^~ /admin/assets/ {
        try_files $uri =404;
    }

    location /admin/ {
        try_files $uri /admin/index.html;
    }

    location = /api/v1/admin {
        return 404;
    }

    location ^~ /api/v1/admin/ {
        return 404;
    }

    location ^~ /api/v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_pass http://127.0.0.1:18443;
    }

    location / {
        return 404;
    }
}
